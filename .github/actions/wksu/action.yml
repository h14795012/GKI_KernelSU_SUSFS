name: Setup Wild KSU
description: Download and configure Wild KSU with version tracking
inputs:
  ksu_commit:
    description: "KSU Commit"
    required: true
    type: string

runs:
  using: composite
  steps:
    - name: Download Wild KSU
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        # Clone the repository with exported environment variables
        curl -LSs "https://raw.githubusercontent.com/h14795012/Wild_KSU/bootable/kernel/setup.sh" | env KSU_OWNER=h14795012 KSU_REPO=Wild_KSU KSU_BRANCH=bootable bash -s -- "${{ inputs.ksu_commit }}"

    - name: Enable KernelSU Config
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        cat >> "${{ github.workspace }}/wild_gki.fragment" << 'EOF'
        # KernelSU Configuration
        CONFIG_KSU=y
        EOF
    
    - name: Extract KSU Version Info
      id: ksu-version
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/Wild_KSU
      run: |
        # Extract and export KSU version info
        ACTUAL_COMMIT=$(git rev-parse HEAD 2>/dev/null)
        echo "Actual Wild_KSU HEAD: $ACTUAL_COMMIT"
        if [ -n "${{ inputs.ksu_commit }}" ]; then
          case "$ACTUAL_COMMIT" in
            ${{ inputs.ksu_commit }}*) echo "[+] Verified: HEAD matches expected commit" ;;
            *) echo "[WARNING] HEAD $ACTUAL_COMMIT does not match ${{ inputs.ksu_commit }}" ;;
          esac
        fi
        KSU_GIT_VERSION=$(git rev-list --count HEAD 2>/dev/null)
        KSU_GIT_TAG=$(git describe --tags --abbrev=0 2>/dev/null)
        KSU_COMMIT=$(git rev-parse --short HEAD 2>/dev/null)
        KSU_VERSION=$((30000 + KSU_GIT_VERSION))
        
        echo "KSU_GIT_TAG=$KSU_GIT_TAG" >> $GITHUB_ENV
        echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
        echo "KSU_COMMIT=$KSU_COMMIT" >> $GITHUB_ENV
